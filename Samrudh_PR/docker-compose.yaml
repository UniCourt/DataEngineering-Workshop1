version: "3"
services:
  # This is your Python container from before
  python_service:
    build:
      context: ./
      dockerfile: Dockerfile
    image: workshop1
    container_name: workshop_python_container
    stdin_open: true
    tty: true
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  # This is your NEW Postgres container
  psql-db:
    image: 'postgres:14'
    container_name: psql-db
    environment:
      - PGPASSWORD=123456
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
    ports:
      - '5434:5432'
