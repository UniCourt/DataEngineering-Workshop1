version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: blogpass
    ports:
      - "5432:5432"

  scraper:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: blogdb
      DB_USER: bloguser
      DB_PASS: blogpass
