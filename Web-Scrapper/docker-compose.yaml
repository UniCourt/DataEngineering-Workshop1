services:
  python_service:
    build:
      context: ./
      dockerfile: Dockerfile
    image: blog-scraper
    container_name: blog_scraper_container
    working_dir: /root/workspace/src
    stdin_open: true
    tty: true
    environment:
      - DB_HOST=psql-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=123456
      - DB_NAME=postgres
    depends_on:
      psql-db:
        condition: service_healthy
  psql-db:
    image: 'postgres:14'
    container_name: psql-db
    environment:
      - PGPASSWORD=123456
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
