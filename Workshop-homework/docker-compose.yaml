services:

  blog_scraper:
    build:
      context: .
      dockerfile: Dockerfile
    image: python-blog-scraper
    container_name: blog_scraper
    depends_on:
      - psql-db

  psql-db:
    image: postgres:14
    container_name: homework-psql-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: demo
    ports:
      - "5435:5432"
