version: "3"

services:
  db:
    image: postgres:14-alpine
    container_name: workshop_postgres
    restart: always
    environment:
      POSTGRES_USER: workshop_user
      POSTGRES_PASSWORD: workshop_pass
      POSTGRES_DB: workshop_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop_user -d workshop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  python_service:
    build:
      context: ./
      dockerfile: Dockerfile
    image: workshop1
    container_name: workshop_python_container
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: workshop_db
      DB_USER: workshop_user
      DB_PASSWORD: workshop_pass
    volumes:
      - .:/root/workspace/src

volumes:
  pgdata: