services:

  postgres:
    image: postgres
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blogs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blogs"]
      interval: 5s
      timeout: 5s
      retries: 5

  scraper:
    build: .
    container_name: blog-scraper
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
