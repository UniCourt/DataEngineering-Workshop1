services:
  psql-db:
    image: postgres:14
    container_name: psql-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=blogs_db
    ports:
      - '5434:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blogs_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  scraper:
    build: .
    container_name: workshop_python_container
    depends_on:
      psql-db:
        condition: service_healthy
    environment:
      - DB_HOST=psql-db
      - DB_NAME=blogs_db
      - DB_USER=postgres
      - DB_PASSWORD=123456
      - DB_PORT=5432

volumes:
  pgdata:
