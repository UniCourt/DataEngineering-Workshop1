services:
 python_service:
   build:
     context: ./
     dockerfile: Dockerfile
   image: workshop1
   container_name: simple_python
   stdin_open: true #  docker attach container_id
   tty: true
   working_dir: /app
   command: python main.py
   environment:
    - DB_HOST=psql-db
    - DB_PORT=5432
    - DB_USER=postgres
    - DB_PASSWORD=123456
    - DB_NAME=postgres
   ports:
    - "8000:8000"
   volumes:
    - .:/app
   depends_on:
    psql-db:
      condition: service_healthy
 psql-db:
   image: 'postgres:14'
   container_name: psql-db
   environment:
    - PGPASSWORD=123456
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=123456
   ports:
    - '5432:5432'
   healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 10s
