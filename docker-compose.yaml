services:
  postgres:
    image: postgres:16
    container_name: workshop_postgres
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
      POSTGRES_DB: workshop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workshop_scraper
    depends_on:
      - postgres

volumes:
  postgres_data:
