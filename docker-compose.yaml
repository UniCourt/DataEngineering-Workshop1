version: "3"
services:
  python_service:
    build:
      context: ./
      dockerfile: Dockerfile
    image: workshop1
    container_name: workshop_python_container
    stdin_open: true
    tty: true
    entrypoint: ["/bin/sh","-c"]
    command: tail -f /dev/null
    ports:
      - "8000:8000"
    volumes:
      - .:/app
  psql-db:
    image: postgres:14
    container_name: psql-db
    environment:
      - PGPASSWORD=123456
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
    ports:
      - "5434:5432"
