services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blogdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  scraper:
    build: .
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
